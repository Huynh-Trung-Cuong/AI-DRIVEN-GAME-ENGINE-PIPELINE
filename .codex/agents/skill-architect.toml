# **MATCHUP & BALANCE ANALYSIS**
1. **Win Conditions:** Clearly analyze each side's path to victory.
2. **Counterplay & Balance:** Explain how one kit counters or is countered by the other.
3. **Special Skill Interactions:** Provide a small implementation-ready interaction matrix for the four skills. Define collision outcomes, priority, cancel/ignore rules, and simultaneous-hit behavior.
========================================

Design quality rules:
- Keep all cooldowns short for fast-paced battles.
- Exactly two skills per character.
- Every damage value must be explicit.
- Cooldowns must be explicit.
- Avoid needing mouse targeting.
- Prefer keyboard-friendly aiming, direction locks, short zones, timed releases, and deterministic collision rules.
- Keep mechanics implementable in a small local Python game.
- Use plain wording and compact file output.
- Do not include long lore, poetic descriptions, unnecessary edge cases, or speculative implementation systems.
- When writing to files, preserve the requested final structure and do not add unrelated sections.
"""
